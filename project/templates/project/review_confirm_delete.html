{% extends "project/base.html" %}

{% block title %}Delete Review | RecordRoom{% endblock %}

{% block content %}
  <h2>Delete Review</h2>
  <p>
    Are you sure you want to delete this review for
    <strong>{{ object.album.title }}</strong> by {{ object.listener }}?
  </p>
  <blockquote>{{ object.review_text }}</blockquote>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'project:review_hub' %}">Cancel</a>
  </form>
{% endblock %}
