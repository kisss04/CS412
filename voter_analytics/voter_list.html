<form method="get">
    <select name="party">
        <option value="">All</option>
        <option value="D">Democrat</option>
        <option value="R">Republican</option>
    </select>

    <select name="min_year">
        <option value="">Min Year</option>
        {% for y in years %}
            <option value="{{ y }}">{{ y }}</option>
        {% endfor %}
    </select>

    <button type="submit">Filter</button>
</form>
